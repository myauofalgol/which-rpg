# Builds and deploys the site, but only once the version has actually changed.
#
# It is triggered by the "Version bump" workflow finishing rather than by the
# push itself, because a bump commit pushed with the default GITHUB_TOKEN does
# not fire push-based workflows. It then looks for a changed "version: x.y.z"
# line in the latest commit: if there isn't one, the build is skipped.
#
# Set Settings -> Pages -> Build and deployment -> Source to "GitHub Actions"
# so this is the only thing that publishes the site.
name: Deploy

on:
  workflow_run:
    workflows: ["Version bump"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    outputs:
      deploy: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || 'main' }}
          fetch-depth: 0

      - name: Detect a version update
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run; building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git show --format= HEAD -- js/games.js | grep -qE '^[+-].*version: "[0-9]+\.[0-9]+\.[0-9]+"'; then
            echo "The version was updated; building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No version change in the latest commit; skipping the build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the site
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r index.html catalogue.html favicon.svg css js _site/
          [ -f .nojekyll ] && cp .nojekyll _site/ || true

      - name: Configure Pages
        if: steps.detect.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the site
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
