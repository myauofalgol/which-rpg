# Checks that the JavaScript parses, so a typo can't silently break the site.
#
# The pages load plain <script> files with no build step, so a single missing
# colon (like "year 2019" instead of "year: 2019") is a hard SyntaxError that
# stops the whole catalogue from loading. This job runs "node --check" on every
# file in js/ and fails the run if any of them will not parse.
#
# Note: GitHub Pages is served straight from the branch, so this is a loud
# signal rather than a hard gate on the deploy. Watch the run, or switch Pages
# to a build-and-deploy action if you want a failing check to block it.
name: Validate

on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "index.html"
      - "catalogue.html"
  pull_request:
    paths:
      - "js/**"
      - "index.html"
      - "catalogue.html"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for f in js/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
