# Checks that the JavaScript parses, so a typo can't silently break the site.
#
# The pages load plain <script> files with no build step, so a single missing
# colon (like "year 2019" instead of "year: 2019") is a hard SyntaxError that
# stops the whole catalogue from loading. This job runs "node --check" on every
# file in js/ and fails the run if any of them will not parse.
#
# Pull requests only: pushes to main are covered by the deploy workflow, which
# runs the same check before it will publish.
name: Validate

on:
  pull_request:
    paths:
      - "js/**"
      - "index.html"
      - "catalogue.html"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for f in js/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
